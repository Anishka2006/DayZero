<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DayZero | Preparing Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .loading-container {
      text-align: center;
      padding: 40px;
      max-width: 480px;
      width: 100%;
    }

    .logo-section {
      margin-bottom: 48px;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.3);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 60px rgba(139, 92, 246, 0.3);
      }
      50% {
        box-shadow: 0 0 80px rgba(139, 92, 246, 0.5);
      }
    }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #6b7280;
      font-size: 15px;
      margin-top: 8px;
      font-weight: 500;
    }

    .status-section {
      margin-bottom: 40px;
    }

    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: #8b5cf6;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(1) {
      animation-delay: 0s;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      40% {
        transform: translateY(-12px);
        opacity: 1;
      }
    }

    .status-text {
      font-size: 18px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 8px;
      min-height: 28px;
      transition: opacity 0.3s ease;
    }

    .status-text.fade-out {
      opacity: 0;
    }

    .status-text.fade-in {
      opacity: 1;
    }

    .progress-section {
      margin-bottom: 32px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #1f2937;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6 0%, #6366f1 100%);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    .fallback-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #1f2937;
      display: none;
    }

    .fallback-section.visible {
      display: block;
    }

    .fallback-message {
      color: #f59e0b;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .retry-btn {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .retry-btn:hover {
      background: #7c3aed;
      transform: translateY(-1px);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .error-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #1f2937;
      display: none;
    }

    .error-section.visible {
      display: block;
    }

    .error-message {
      color: #ef4444;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .tips-section {
      margin-top: 24px;
      padding: 16px;
      background: #111827;
      border-radius: 8px;
      border: 1px solid #1f2937;
    }

    .tips-title {
      color: #9ca3af;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .tips-text {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="logo-section">
      <div class="logo">DZ</div>
      <div class="logo-text">DayZero</div>
      <div class="subtitle">Preparing your company sprint room</div>
    </div>

    <div class="status-section">
      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="status-text" id="statusText">Initializing workspace...</div>
    </div>

    <div class="progress-section">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="fallback-section" id="fallbackSection">
      <p class="fallback-message" id="fallbackMessage">Waiting for the local simulation backend...</p>
      <button class="retry-btn" id="retryBtn">Retry connection</button>
    </div>

    <div class="error-section" id="errorSection">
      <p class="error-message" id="errorMessage">Could not initialize simulation. Please retry.</p>
      <button class="retry-btn" id="errorRetryBtn">Try again</button>
    </div>

    <div class="tips-section">
      <div class="tips-title">Tip</div>
      <div class="tips-text">First-time load may take a few seconds as we prepare your AI teammates and workspace.</div>
    </div>
  </div>

  <script src="../js/loading.js?v=5"></script>
</body>
</html>
